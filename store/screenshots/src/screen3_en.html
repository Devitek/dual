<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="screens.css"></head>
<body>
  <div class="viewfinder"></div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.6)"></div>

  <div class="sheet">
    <div class="handle"></div>
    <div class="sheethead">
      <h1>Settings</h1>
      <div class="morebtn"><i></i><i></i><i></i></div>
    </div>
    <div class="tabs"><div class="tabcell">General</div><div class="tabcell on">Pro</div></div>

    <div class="setcol">
      <div class="lbl"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><text x="12" y="16" text-anchor="middle" font-size="9" font-weight="800" stroke="none" fill="#E6E0E9">HQ</text></svg>Quality</div>
      <div class="segbar">
        <div class="segcell">Standard<span class="cap">1080p·720p</span></div>
        <div class="segcell on">✓ High<span class="cap">1080p·1080p</span></div>
        <div class="segcell">Max<span class="cap">4K·1080p</span></div>
      </div>
      <div class="qhint">“Max”: 4K photo, 1080p video. Changing quality briefly restarts the cameras.</div>
    </div>

    <div class="setcol">
      <div class="lbl"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><rect x="8" y="13" width="8" height="6" rx="1"/><path d="M8 3v5h7V3" stroke-width="1.7"/></svg>Save</div>
      <div class="segbar">
        <div class="segcell on">✓ PiP</div>
        <div class="segcell">PiP + 2</div>
        <div class="segcell">2 files</div>
      </div>
      <div class="qhint">One merged video (re-encoded at the end of the take).</div>
    </div>
  </div>
</body></html>
