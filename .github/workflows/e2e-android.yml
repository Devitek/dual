name: E2E Maestro (emulator)

# Smoke E2E (issue #147) : APK release (signature debug) sur emulateur GHA,
# flows Maestro de .maestro/ (launch, invariant reglages §8, capture+galerie).
#
# NON requis pour merger (smoke, pas gate) : dispatch manuel + cron hebdo.
# Contrainte : l'emulateur n'a pas de concurrent-camera, l'app tourne donc en
# mode sequentiel/mono ; les flows restent valides (permission/UI/reglages/
# galerie), la capture DUAL reelle ne se verifie que sur device physique.
#
# Gotcha AVD : premier run ~10 min de plus (image systeme + creation AVD) ;
# ensuite le cache (~/.android/avd) est reutilise via le pattern officiel
# android-emulator-runner (run de warm-up snapshot si cache manquant).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-android
  cancel-in-progress: false

env:
  API_LEVEL: 34

jobs:
  e2e:
    name: Maestro smoke (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install JS dependencies
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (debug-signed, bundle JS embarque)
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: android

      - name: Install Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}

      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb shell pm grant fr.devitek.twinlens android.permission.CAMERA
            adb shell pm grant fr.devitek.twinlens android.permission.RECORD_AUDIO
            adb logcat -c || true
            maestro test .maestro/ --format junit --output maestro-report.xml || STATUS=$?
            adb logcat -d > logcat.txt || true
            exit "${STATUS:-0}"

      - name: Upload artifacts (report, screenshots, logcat)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: maestro-artifacts
          path: |
            maestro-report.xml
            logcat.txt
            ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 14
