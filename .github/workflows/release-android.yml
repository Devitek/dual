name: Release (Play Store)

# Build d'un AAB SIGNÉ (upload key), attaché à la GitHub Release, + upload Play.
# 100% gratuit (build GitHub Actions, pas d'EAS).
#
# Déclenchement :
#   - release (published) : AUTO. release-please crée la release via le PAT
#     RELEASE_PLEASE_TOKEN → l'event `release` cascade → build AAB signé +
#     upload auto sur le canal INTERNE de Play (draft). C'est le chemin nominal.
#     (Découplé du job release-please : même si son nettoyage de labels échoue,
#      la release existe et cet event se déclenche quand même.)
#   - workflow_dispatch : MANUEL (rebuild / upload ponctuel), upload Play optionnel.
#
# versionCode = `git rev-list --count HEAD` : MONOTONE et INDÉPENDANT du workflow
#   (évite tout rejet Play « versionCode doit être supérieur »). fetch-depth: 0.
# versionName = tag sans le « v ».
#
# Secrets : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD (+ PLAY_SERVICE_ACCOUNT_JSON pour l'upload).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: 'Envoyer aussi sur Google Play'
        type: boolean
        default: false
      track:
        description: 'Piste Play (si upload)'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_status:
        description: 'Statut de la release Play (si upload)'
        type: choice
        options: [draft, completed]
        default: draft

concurrency:
  group: release-android-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build signed AAB (+ optional Play upload)
    runs-on: ubuntu-latest
    # Environment protégé : seuls `main` et les tags `v*` peuvent déployer, et
    # les secrets sensibles (keystore, Play SA) peuvent être scoppés à cet
    # environment (inaccessibles aux autres workflows). Pas de reviewer requis :
    # le merge de la release PR est déjà LA validation humaine (pas de double
    # porte). Voir RELEASE.md §Secrets.
    environment: play-internal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Historique complet requis pour `git rev-list --count HEAD` (versionCode).
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install JS dependencies
        run: npm ci

      - name: Resolve version (name from tag, code from commit count)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          fi
          NAME="$(echo "$TAG" | sed 's/^v//')"
          CODE="$(git rev-list --count HEAD)"
          {
            echo "tag=${TAG}"
            echo "name=${NAME:-1.0.0}"
            echo "code=${CODE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=${NAME:-1.0.0} versionCode=${CODE} (tag=${TAG:-none})"

      # Garde versionCode (#150, ADR 0002) : échec AVANT le build (~25 min) si
      # le code calculé n'est pas STRICTEMENT supérieur au max publié sur Play.
      # Best-effort : API Play injoignable => warning, le build continue.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Guard - versionCode must exceed the max published on Play
        env:
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          pip install --quiet google-auth requests
          printf '%s' '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/play-guard.json"
          PLAY_SERVICE_ACCOUNT_JSON_PATH="$RUNNER_TEMP/play-guard.json" python3 store/check_versioncode.py

      # IMPÉRATIF : le versionCode doit être posé dans app.json AVANT `expo
      # prebuild`, car prebuild le fige dans android/app/build.gradle. Le flag
      # Gradle `-Pandroid.injected.version.code` est IGNORÉ par le build RN/Expo
      # (l'AAB repartait sinon sur versionCode 1 -> rejet Play « déjà utilisé »).
      - name: Set versionCode / versionName in app.json (before prebuild)
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "app.json";
            const a = JSON.parse(fs.readFileSync(p, "utf8"));
            a.expo.version = process.env.APP_VERSION_NAME;
            a.expo.android = a.expo.android || {};
            a.expo.android.versionCode = Number(process.env.APP_VERSION_CODE);
            fs.writeFileSync(p, JSON.stringify(a, null, 2) + "\n");
            console.log("app.json -> version " + a.expo.version + " / versionCode " + a.expo.android.versionCode);
          '

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      # Les secrets passent par `env:` (jamais interpolés `${{ }}` dans le corps
      # des scripts) : pas d'injection shell possible quel que soit leur contenu,
      # et le script reste identique d'un run à l'autre.
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed AAB
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
            -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"

      - name: Name the AAB (+ R8 mapping)
        id: aab
        run: |
          SRC=android/app/build/outputs/bundle/release/app-release.aab
          VER="${{ steps.ver.outputs.tag }}"
          [ -z "$VER" ] && VER="r${{ steps.ver.outputs.code }}"
          OUT="TwinLens-${VER}.aab"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          # Mapping R8 (désobfuscation des crashs — Play Vitals + archive Release).
          MAP=android/app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAP" ]; then
            MOUT="TwinLens-${VER}-mapping.txt"
            cp "$MAP" "$MOUT"
            echo "mapping=$MOUT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::mapping.txt absent (minify désactivé ?)"
            echo "mapping=" >> "$GITHUB_OUTPUT"
          fi

      # Budget de taille (finding 2.7) : l'AAB pèse ~73 Mo avec R8 (4 ABIs).
      # Seuil d'alerte à 85 Mo : une dérive soudaine (asset embarqué par erreur,
      # minify désactivé, lib dupliquée) doit se voir À LA RELEASE, pas chez les
      # utilisateurs. Alerte non bloquante — ajuster le seuil en connaissance de
      # cause si la croissance est légitime.
      - name: AAB size budget
        env:
          AAB_PATH: ${{ steps.aab.outputs.path }}
          BUDGET_MB: '85'
        run: |
          SIZE=$(stat -c%s "$AAB_PATH")
          SIZE_MB=$((SIZE / 1024 / 1024))
          {
            echo "### 📦 Taille du livrable"
            echo ""
            echo "| Fichier | Taille | Budget |"
            echo "|---|---|---|"
            echo "| $AAB_PATH | ${SIZE_MB} Mo | ${BUDGET_MB} Mo |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE_MB" -gt "$BUDGET_MB" ]; then
            echo "::warning title=Budget AAB dépassé::AAB ${SIZE_MB} Mo > budget ${BUDGET_MB} Mo — vérifier assets/minify avant de promouvoir."
          else
            echo "AAB ${SIZE_MB} Mo ≤ budget ${BUDGET_MB} Mo ✓"
          fi

      - name: Attach AAB + mapping to the GitHub release
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAPPING: ${{ steps.aab.outputs.mapping }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" "${{ steps.aab.outputs.path }}" --clobber
          [ -n "$MAPPING" ] && gh release upload "${{ steps.ver.outputs.tag }}" "$MAPPING" --clobber

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: twinlens-aab
          path: |
            ${{ steps.aab.outputs.path }}
            ${{ steps.aab.outputs.mapping }}
          if-no-files-found: error

      # Upload Play : AUTO sur l'event release → canal interne, DÉPLOYÉ
      # (release_status=completed : l'interne ne passe pas par l'examen Google,
      # les testeurs reçoivent la maj sans action manuelle). En manuel
      # (workflow_dispatch), le défaut reste `draft` (ou le choix de l'input).
      - name: Write Play service account key
        if: ${{ github.event_name == 'release' || inputs.upload_to_play }}
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SA_JSON" > "$RUNNER_TEMP/play.json"

      - name: Upload to Google Play (Fastlane supply)
        if: ${{ github.event_name == 'release' || inputs.upload_to_play }}
        env:
          AAB_PATH: ${{ steps.aab.outputs.path }}
          MAPPING_PATH: ${{ steps.aab.outputs.mapping }}
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play.json
          SUPPLY_TRACK: ${{ inputs.track || 'internal' }}
          SUPPLY_RELEASE_STATUS: ${{ github.event_name == 'release' && 'completed' || inputs.release_status || 'draft' }}
        run: bundle exec fastlane android internal
