name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Doctor · Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint (ratchet --max-warnings, cf. eslint.config.js)
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Jest
        run: npm test -- --ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Metro bundle (Android)
        run: npx expo export --platform android --output-dir dist
        env:
          CI: 'true'
